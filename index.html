<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Painel da Rede</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0D1117;color:#8B949E;
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  #f{border:0;width:100%;height:100%;display:block}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px}
</style>
</head>
<body>
<div id="load">Carregando o painel atualizado…</div>
<iframe id="f" title="Painel da Rede"></iframe>
<script>
  // sempre busca a versão mais recente do painel, ignorando cache (query única a cada abertura)
  var f = document.getElementById('f');
  f.onload = function(){ var l = document.getElementById('load'); if (l) l.style.display='none'; };
  f.src = 'painel.html?v=' + Date.now();
</script>
</body>
</html>
